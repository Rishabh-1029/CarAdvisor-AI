<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: dark navy rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="#0b1e33"/>

  <!-- Subtle inner glow ring -->
  <rect width="64" height="64" rx="14" ry="14" fill="none" stroke="#3ac6ff" stroke-width="1.5" opacity="0.25"/>

  <!-- "T" letter -->
  <text
    x="9"
    y="46"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="800"
    font-size="34"
    fill="white"
    letter-spacing="-1"
  >T</text>

  <!-- "D" letter in brand cyan -->
  <text
    x="32"
    y="46"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="800"
    font-size="34"
    fill="#3ac6ff"
    letter-spacing="-1"
  >D</text>

  <!-- Accent underline -->
  <rect x="9" y="50" width="46" height="2.5" rx="1.25" fill="#3ac6ff" opacity="0.7"/>
</svg>
